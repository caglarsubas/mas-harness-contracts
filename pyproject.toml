[build-system]
requires = []
build-backend = "planeon_harness_contracts.build_backend"
backend-path = ["src"]

[project]
name = "planeon-harness-contracts"
version = "0.1.0"
description = "Offline-first public contracts and deterministic tooling for the Planeon MAS harness platform"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Planeon Harness Engineering maintainers" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
harnessctl = "planeon_harness_contracts.cli:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["planeon_harness_contracts"]
mypy_path = "src"

